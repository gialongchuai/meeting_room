server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: meeting-room-booking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meeting_room}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

app:
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

booking:
  min-duration-minutes: ${BOOKING_MIN_DURATION_MINUTES:15}
  max-duration-minutes: ${BOOKING_MAX_DURATION_MINUTES:240}
  time-slot-step-minutes: ${BOOKING_TIME_SLOT_STEP_MINUTES:15}
  max-lead-days: ${BOOKING_MAX_LEAD_DAYS:60}
  working-hours-start: ${BOOKING_WORKING_HOURS_START:08:00}
  working-hours-end: ${BOOKING_WORKING_HOURS_END:18:00}
  quota-per-user: ${BOOKING_QUOTA_PER_USER:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.company.roombooking: INFO
    org.hibernate.SQL: INFO
